<div class="m16">
  <div class="m16-hero">
    <canvas id="m16petals"></canvas>
    <div class="kick">{{hero.eyebrow}}</div>
    <h1>{{hero.title}}</h1>
    <p>{{hero.role}}</p>
  </div>
  <div class="m16-garden" id="m16garden"><span class="ghint">🌱 Chạm vào vườn để ươm hoa</span></div>
  <div class="m16-count"><b id="m16count">0</b> bông hoa đã nở trong vườn</div>
  <div class="m16-cards">
    <a class="m16-card" href="{{card1.href}}"><div class="ic">🌸</div><h4>{{card1.title}}</h4><p>{{card1.desc}}</p></a>
    <a class="m16-card" href="{{card2.href}}"><div class="ic">🌼</div><h4>{{card2.title}}</h4><p>{{card2.desc}}</p></a>
    <a class="m16-card" href="{{card3.href}}"><div class="ic">🌷</div><h4>{{card3.title}}</h4><p>{{card3.desc}}</p></a>
  </div>
  <div class="m16-verse">{{verse.text}} — {{verse.ref}}</div>
  <div class="m16-f">{{footer.copyright}} · {{footer.parish}}</div>
</div>
