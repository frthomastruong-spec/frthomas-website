<div class="m15">
  <div class="m15-hero" id="m15hero">
    <canvas id="m15sky"></canvas>
    <div class="m15-in" id="m15in">
      <div class="kick">{{hero.eyebrow}}</div>
      <h1>{{hero.title}}</h1>
      <div class="hint">✨ Chạm lên bầu trời để ước một điều</div>
      <div class="m15-cd">
        <div class="box"><b id="m15d">–</b><span>Ngày</span></div>
        <div class="box"><b id="m15h">–</b><span>Giờ</span></div>
        <div class="box"><b id="m15m">–</b><span>Phút</span></div>
        <div class="box"><b id="m15s">–</b><span>Giây</span></div>
      </div>
      <div class="m15-cd-cap">đến ngày khởi hành {{card0.title}}</div>
    </div>
  </div>
  <div class="m15-type"><p id="m15verse"></p></div>
  <div class="m15-cards">
    <a class="m15-card" href="{{card1.href}}"><div class="ic">🌙</div><h4>{{card1.title}}</h4><p>{{card1.desc}}</p></a>
    <a class="m15-card" href="{{card2.href}}"><div class="ic">⭐</div><h4>{{card2.title}}</h4><p>{{card2.desc}}</p></a>
    <a class="m15-card" href="{{card3.href}}"><div class="ic">☁️</div><h4>{{card3.title}}</h4><p>{{card3.desc}}</p></a>
  </div>
  <div class="m15-f">{{footer.copyright}} · {{footer.parish}}</div>
</div>
