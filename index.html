<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fr. Thomas · Linh mục Công giáo</title>
<meta name="description" content="Fr. Thomas — linh mục phụ tá Giáo xứ St. Francis Xavier, Vancouver. Nơi lưu giữ các mục vụ: hành hương, bài giảng, học hỏi Kinh Thánh và sách.">
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Fr. Thomas">
<meta property="og:title" content="Fr. Thomas · Linh mục Công giáo">
<meta property="og:description" content="Cùng nhau bước đi trong đức tin, tôn vinh Chúa và phục vụ tha nhân.">
<meta property="og:url" content="https://frthomas.com/">
<meta property="og:image" content="https://frthomas.com/assets/images/home-hero.jpg">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: #f8f5ec; color: #3c4f66; }
  #app { min-height: 100vh; }
  #app .loading { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: #8a97a8; font-size: 14px; }
  #app .loading .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #e2d9bd; border-top-color: #b08d3e; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #previewBar { position: fixed; top: 0; left: 0; right: 0; z-index: 500; background: #1e3a5f; color: #fff; font-size: 13.5px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; display: none; align-items: center; justify-content: center; gap: 10px; }
  #previewBar a { color: #e8c877; font-weight: 600; }
  /* Nút menu nổi (floating menu) — dùng chung mọi theme */
  .fm-btn { position: fixed; right: 22px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 200; width: 62px; height: 62px; border-radius: 50%; background: linear-gradient(145deg, #2a507e, #1c3554); color: #fff; border: 1px solid rgba(255,255,255,.18); font-size: 25px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 34px rgba(30,58,95,.38), inset 0 1px 0 rgba(255,255,255,.15); transition: transform .38s cubic-bezier(.34,1.4,.64,1), background .25s ease, box-shadow .25s ease; }
  .fm-btn:hover { transform: scale(1.08); box-shadow: 0 18px 42px rgba(30,58,95,.46), inset 0 1px 0 rgba(255,255,255,.15); }
  .fm-btn:active { transform: scale(.94); }
  .fm-btn.open { transform: rotate(135deg); background: linear-gradient(145deg, #b08d3e, #8f6f2c); }
  .fm-btn:focus-visible { outline: 3px solid #b08d3e; outline-offset: 3px; }
  .fm-ov { position: fixed; inset: 0; z-index: 300; background: transparent; opacity: 0; pointer-events: none; transition: opacity .22s ease; }
  .fm-ov.open { opacity: 1; pointer-events: auto; }
  .fm-panel { position: absolute; right: 22px; bottom: 96px; width: 200px; max-height: 80vh; overflow-y: auto; background: rgba(251,248,238,.94); -webkit-backdrop-filter: blur(16px) saturate(1.15); backdrop-filter: blur(16px) saturate(1.15); border: 1px solid rgba(214,198,160,.85); border-radius: 20px; padding: 10px 10px 8px; box-shadow: 0 28px 64px rgba(30,58,95,.28), 0 4px 14px rgba(0,0,0,.08); transform: scale(.8) translateY(18px); transform-origin: bottom right; opacity: 0; transition: transform .42s cubic-bezier(.34,1.45,.5,1), opacity .3s ease; }
  .fm-ov.open .fm-panel { transform: none; opacity: 1; }
  .fm-x { position: absolute; top: 6px; right: 12px; background: none; border: 0; font-size: 24px; line-height: 1; color: #1e3a5f; cursor: pointer; padding: 8px; border-radius: 50%; transition: transform .3s ease, color .2s ease, background .2s ease; }
  .fm-x:hover { transform: rotate(90deg); color: #b08d3e; background: rgba(176,141,62,.12); }
  .fm-brand { text-align: center; margin-bottom: 2px; padding-bottom: 8px; border-bottom: 1px solid #ece2c8; }
  .fm-brand b { display: block; font-family: 'Playfair Display', Georgia, serif; font-size: 16px; color: #1e3a5f; }
  .fm-links a { display: flex; align-items: center; justify-content: center; text-align: center; padding: 9px 10px; margin: 2px 0; border-radius: 12px; color: #1e3a5f; font-size: 14px; font-weight: 600; text-decoration: none; opacity: 0; transform: translateX(-18px); transition: opacity .45s ease, transform .55s cubic-bezier(.2,.7,.2,1), background .18s ease, color .18s ease; }
  .fm-ov.open .fm-links a { opacity: 1; transform: none; }
  .fm-ov.open .fm-links a:nth-child(1) { transition-delay: .06s, .06s, 0s, 0s; }
  .fm-ov.open .fm-links a:nth-child(2) { transition-delay: .14s, .14s, 0s, 0s; }
  .fm-ov.open .fm-links a:nth-child(3) { transition-delay: .22s, .22s, 0s, 0s; }
  .fm-ov.open .fm-links a:nth-child(4) { transition-delay: .30s, .30s, 0s, 0s; }
  .fm-ov.open .fm-links a:nth-child(5) { transition-delay: .38s, .38s, 0s, 0s; }
  .fm-ov.open .fm-links a:hover { transition-delay: 0s, 0s, 0s, 0s; transform: translateX(4px); background: rgba(176,141,62,.12); }
  .fm-links a.on { color: #8f6f2c; background: rgba(176,141,62,.14); }
  @media (prefers-reduced-motion: reduce) { .fm-ov, .fm-panel, .fm-btn, .fm-links a, .fm-x, #app .loading .spin { transition: none !important; animation: none !important; } .fm-links a { opacity: 1 !important; transform: none !important; } }
</style>
</head>
<body>
<div id="previewBar"></div>
<div id="app"><div class="loading"><div class="spin"></div><div>Đang tải…</div></div></div>
<noscript><div style="padding:60px 20px;text-align:center">Trang web cần JavaScript để hiển thị. Vui lòng bật JavaScript.</div></noscript>
<script>
(function(){
  var app = document.getElementById('app');
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function txt(s){ return esc(s).replace(/\n/g,'<br>'); }
  function getPath(o, p){ return p.split('.').reduce(function(a,k){ return (a == null ? a : a[k]); }, o); }
  function fill(tpl, content){
    tpl = tpl.replace(/<!--CARDS-->([\s\S]*?)<!--\/CARDS-->/g, function(m, block){
      return (content.ministries.cards || []).map(function(cd, i){
        return block
          .replace(/\{\{card\.n\}\}/g, String(i+1))
          .replace(/\{\{card\.title\}\}/g, txt(cd.title))
          .replace(/\{\{card\.desc\}\}/g, txt(cd.desc))
          .replace(/\{\{card\.link\}\}/g, txt(cd.link))
          .replace(/\{\{card\.href\}\}/g, esc(cd.href))
          .replace(/\{\{card\.img\}\}/g, esc(cd.img));
      }).join('');
    });
    tpl = tpl.replace(/\{\{card([0-3])\.(\w+)\}\}/g, function(m, n, k){
      var cd = (content.ministries.cards || [])[+n] || {};
      var v = cd[k] == null ? '' : cd[k];
      return (k === 'href' || k === 'img') ? esc(v) : txt(v);
    });
    tpl = tpl.replace(/\{\{([a-z0-9_.]+)\}\}/gi, function(m, p){
      var v = getPath(content, p);
      if (v == null) return '';
      var last = p.split('.').pop();
      return (last === 'img' || last === 'href') ? esc(v) : txt(v);
    });
    return tpl;
  }
  function buildFloatingMenu(base){
    var items = [
      ['Trang chủ', base, ''],
      ['Hành hương', base + 'hanh-huong/', 'hanh-huong'],
      ['Bài giảng', base + 'bai-giang/', 'bai-giang'],
      ['Học Kinh Thánh', base + 'hoc-kinh-thanh/', 'hoc-kinh-thanh'],
      ['Sách', base + 'sach/', 'sach']
    ];
    var path = window.location.pathname.replace(/\/$/, '');
    var btn = document.createElement('button');
    btn.className = 'fm-btn'; btn.setAttribute('aria-label', 'Mở menu'); btn.innerHTML = '☰';
    var ov = document.createElement('div'); ov.className = 'fm-ov';
    var links = items.map(function(it){
      var on = (it[2] === '' && (path === '' || path === '/')) || (it[2] && path.indexOf('/' + it[2]) === 0);
      return '<a href="' + it[1] + '"' + (on ? ' class="on"' : '') + '>' + it[0] + '</a>';
    }).join('');
    ov.innerHTML = '<div class="fm-panel" role="dialog" aria-label="Menu điều hướng">' +
      '<button class="fm-x" aria-label="Đóng menu">×</button>' +
      '<div class="fm-brand"><b>Fr. Thomas</b></div>' +
      '<div class="fm-links">' + links + '</div></div>';
    document.body.appendChild(btn); document.body.appendChild(ov);
    function open(){ ov.classList.add('open'); btn.classList.add('open'); btn.innerHTML = '×'; btn.setAttribute('aria-label', 'Đóng menu'); btn.setAttribute('aria-expanded', 'true'); }
    function close(){ ov.classList.remove('open'); btn.classList.remove('open'); btn.innerHTML = '☰'; btn.setAttribute('aria-label', 'Mở menu'); btn.setAttribute('aria-expanded', 'false'); }
    btn.addEventListener('click', open);
    ov.querySelector('.fm-x').addEventListener('click', close);
    ov.addEventListener('click', function(e){ if (e.target === ov) close(); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
  }
  function loadTheme(slug){
    var THEME_V = '20261002i'; // bump khi sửa template/theme.css/theme.js để máy khách tải bản mới
    return fetch('assets/themes/' + slug + '/meta.json').then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(meta){
      return Promise.all([
        fetch('assets/themes/' + slug + '/template.html?v=' + THEME_V).then(function(r){ if(!r.ok) throw 0; return r.text(); }),
        fetch('assets/themes/' + slug + '/theme.css?v=' + THEME_V).then(function(r){ if(!r.ok) throw 0; return r.text(); }),
        fetch('assets/content.json', { cache: 'no-store' }).then(function(r){ if(!r.ok) throw 0; return r.json(); })
      ]).then(function(res){
        var st = document.createElement('style');
        st.setAttribute('data-theme', slug);
        st.textContent = res[1];
        document.head.appendChild(st);
        app.innerHTML = fill(res[0], res[2]);
        document.title = meta.name + ' — Fr. Thomas · Linh mục Công giáo';
        buildFloatingMenu('./');
        if (meta.has_js) {
          var s = document.createElement('script');
          s.src = 'assets/themes/' + slug + '/theme.js?v=' + THEME_V;
          document.body.appendChild(s);
        }
        return meta;
      });
    });
  }
  function fail(){
    app.innerHTML = '<div class="loading"><div>Không tải được giao diện. Anh thử tải lại trang nhé.</div></div>';
  }
  var preview = new URLSearchParams(location.search).get('theme');
  if (preview) {
    loadTheme(preview).then(function(meta){
      var bar = document.getElementById('previewBar');
      bar.style.display = 'flex';
      bar.innerHTML = '<span>Đang xem thử giao diện <b>' + esc(meta.name) + '</b></span><a href="./">← Về bản chính</a>';
    }).catch(function(){ loadTheme('chan-dung').catch(fail); });
  } else {
    fetch('assets/site.json', { cache: 'no-store' }).then(function(r){ return r.json(); })
      .then(function(s){ return loadTheme((s && s.theme) || 'chan-dung'); })
      .catch(function(){ loadTheme('chan-dung').catch(fail); });
  }
})();
</script>
</body>
</html>
